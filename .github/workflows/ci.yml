name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  SWIFTFORMAT_VERSION: 0.64.0
  SWIFTLINT_VERSION: 0.65.1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Did anything besides docs change
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          FILES=$(git diff --name-only "$BASE" HEAD 2>/dev/null) || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$FILES"
          if echo "$FILES" | grep -vE '^(.*\.md|docs/.*|LICENSE|\.github/dependabot\.yml|\.github/workflows/release\.yml)$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install SwiftFormat and SwiftLint
        run: |
          BIN="$RUNNER_TEMP/bin"
          mkdir -p "$BIN"
          curl -sSfL "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip" -o "$RUNNER_TEMP/swiftformat.zip"
          curl -sSfL "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" -o "$RUNNER_TEMP/swiftlint.zip"
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$BIN"
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$BIN"
          chmod +x "$BIN/swiftformat" "$BIN/swiftlint"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/swiftformat" --version
          "$BIN/swiftlint" version

      - name: Format
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint --strict

      - name: Same dependencies for SwiftPM and Xcode
        run: |
          diff <(jq -S .pins Package.resolved) \
            <(jq -S .pins Pullo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved) \
            || { echo "::error::Package.resolved and the Xcode project's Package.resolved pin different versions"; exit 1; }

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            ${{ runner.temp }}/packages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

      - name: Build without warnings
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --enable-code-coverage

      - name: Coverage
        run: |
          CODECOV_DIR=$(dirname "$(swift test --show-codecov-path)")
          BUNDLE=$(find "$(swift build --show-bin-path)" -maxdepth 1 -name '*.xctest' | head -n 1)
          BINARY="$BUNDLE/Contents/MacOS/$(basename "$BUNDLE" .xctest)"
          xcrun llvm-cov report "$BINARY" \
            -instr-profile "$CODECOV_DIR/default.profdata" \
            -ignore-filename-regex '(\.build|Tests)/' \
            | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo "### Coverage"
            echo '```'
            tail -n 1 "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Contributors' forks have no signing identity, so CI only proves the app target builds.
      - name: Build the app
        run: |
          xcodebuild build \
            -project Pullo.xcodeproj -scheme Pullo -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
            CODE_SIGNING_ALLOWED=NO

      - name: Save the app build
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4
        with:
          name: Pullo-unsigned-macOS-app
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release/Pullo.app
          if-no-files-found: error
