name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftFormat and SwiftLint
        run: brew install swiftformat swiftlint

      - name: Format
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint --strict

  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      # Contributors' forks have no signing identity, so CI only proves the app target builds.
      - name: Build the app
        run: |
          xcodebuild build \
            -project DevNotch.xcodeproj -scheme DevNotch -configuration Release \
            CODE_SIGNING_ALLOWED=NO
