name: Release

# Pushing a tag like v0.2.0 builds Pullo, signs it with Developer ID, notarizes it, and publishes it
# as a GitHub release along with the updated Sparkle feed, which is where installed copies look for updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
  API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  FEED_URL: https://jordan-cod.github.io/devnotch/appcast.xml

jobs:
  release:
    runs-on: macos-26
    # The first notarization of a new account can take hours; later ones take minutes, and public repos pay nothing to wait.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version from the tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-beta.* ]]; then echo "CHANNEL=beta" >> "$GITHUB_ENV"; else echo "CHANNEL=" >> "$GITHUB_ENV"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "::error::Tags look like v1.2.3 or v1.2.3-beta.4, got $GITHUB_REF_NAME"; exit 1; }
          # Sparkle compares CFBundleVersion, so it has to grow with every release; the commit count always does.
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk -v heading="[$VERSION]" '/^## /{inside = ($2 == heading); next} /^\[[^]]+\]: /{next} inside' CHANGELOG.md)
          [ -n "$(printf %s "$NOTES" | tr -d '[:space:]')" ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          mkdir -p "$RUNNER_TEMP/feed"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh api markdown -f text="$NOTES" -f mode=markdown \
            | sed -E 's#<a id="user-content-[^"]*"[^>]*><span[^>]*></span></a>##g' \
            > "$RUNNER_TEMP/feed/Pullo-$VERSION.html"

      - name: Test
        run: swift test

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Add it to the search list without dropping the login keychain, or codesign can't see the system roots.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE }}
        run: |
          PROFILE="$RUNNER_TEMP/devnotch.provisionprofile"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          PLIST=$(security cms -D -i "$PROFILE")
          UUID=$(plutil -extract UUID raw - <<< "$PLIST")
          echo "PROFILE_NAME=$(plutil -extract Name raw - <<< "$PLIST")" >> "$GITHUB_ENV"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$UUID.provisionprofile"
          done

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project DevNotch.xcodeproj -scheme DevNotch -configuration Release \
            -archivePath "$RUNNER_TEMP/DevNotch.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_ENTITLEMENTS=DevNotch.entitlements PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export with Developer ID
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          plutil -replace teamID -string "$TEAM_ID" ExportOptions.plist
          plutil -replace provisioningProfiles -json "{\"dev.jrdan.devnotch\": \"$PROFILE_NAME\"}" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DevNotch.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Drop Intel slices from Sparkle
        run: .github/thin-sparkle.sh "$RUNNER_TEMP/export/Pullo.app"

      - name: Notarize the app
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          APP="$RUNNER_TEMP/export/Pullo.app"
          echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/api_key.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/api_key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

      # Sparkle downloads this zip; the feed's signature covers its exact bytes, so nothing may touch it after this step.
      - name: Package the update
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Pullo.app" "$RUNNER_TEMP/feed/Pullo-$VERSION.zip"

      # People download the disk image; it's signed and notarized on its own so Gatekeeper accepts it before it's opened.
      - name: Disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild
          DMG="$RUNNER_TEMP/Pullo.dmg"
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s .github/dmg-settings.py \
            -D app="$RUNNER_TEMP/export/Pullo.app" "Pullo" "$DMG"
          codesign --sign "Developer ID Application" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/api_key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"
          cp "$DMG" "$RUNNER_TEMP/DevNotch.dmg"
          rm "$RUNNER_TEMP/api_key.p8"

      - name: Update the Sparkle feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Start from the published feed so earlier versions stay listed.
          curl -sSfL "$FEED_URL" -o "$RUNNER_TEMP/feed/appcast.xml"
          # The tools ship with the resolved package, so they always match the framework inside the app.
          printf %s "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/packages/artifacts/sparkle/Sparkle/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --embed-release-notes \
            ${CHANNEL:+--channel "$CHANNEL"} \
            "$RUNNER_TEMP/feed"
          python3 .github/check-appcast.py "$RUNNER_TEMP/feed/appcast.xml" "$BUILD" "$CHANNEL"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" ${CHANNEL:+--prerelease} \
            --title "Pullo $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/Pullo.dmg" "$RUNNER_TEMP/DevNotch.dmg" "$RUNNER_TEMP/feed/Pullo-$VERSION.zip" "$RUNNER_TEMP/feed/appcast.xml"

      - name: Publish the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin gh-pages
          git worktree add -q --detach "$RUNNER_TEMP/pages" origin/gh-pages
          cp "$RUNNER_TEMP/feed/appcast.xml" "$RUNNER_TEMP/pages/appcast.xml"
          cd "$RUNNER_TEMP/pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Add $VERSION to the update feed"
          git push -q origin HEAD:gh-pages
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent || true
          for attempt in $(seq 60); do
            curl -sfL "$FEED_URL?build=$BUILD&try=$attempt" | grep -q "<sparkle:version>$BUILD</sparkle:version>" && exit 0
            sleep 10
          done
          echo "::error::$FEED_URL still doesn't list build $BUILD"
          exit 1
