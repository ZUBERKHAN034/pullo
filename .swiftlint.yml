# Correctness only; layout is SwiftFormat's job, and size/complexity metrics stay off as in most Swift projects.
included:
  - Sources
  - Tests
only_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - implicitly_unwrapped_optional
  - fatal_error_message
  - modifier_order
  - lower_acl_than_parent
  - private_over_fileprivate
  - unused_closure_parameter
  - unused_optional_binding
  - weak_delegate
  - discouraged_optional_boolean
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - implicit_optional_initialization
  - custom_rules
custom_rules:
  no_print:
    name: "No print"
    regex: "\\b(print|debugPrint|dump)\\("
    message: "Use Logger instead of print."
    severity: error
